# GaussSplit smoke run — 1 tiny epoch just to prove the whole Modal path
# (train -> val -> checkpoint with model.29.head.*) works end to end.
# Delete the resulting run directory afterwards; it is not a result.
seed: 42
data:
  config: /mnt/data/tinyperson-yolo-v2/data.yaml
train:
  epochs: 1
  patience: 1
  val: true
  imgsz: 320
  batch: 4
  workers: 2
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.1
  cos_lr: true
  warmup_epochs: 0.0
  amp: true
  deterministic: false
  degrees: 0.0
  translate: 0.05
  scale: 0.15
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.005
  hsv_s: 0.1
  hsv_v: 0.15
  bgr: 0.0
  mosaic: 0.0
  close_mosaic: 10
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  copy_paste_mode: flip
  augmentations_preset: tinyperson_b
  multi_scale: 0.0
  compile: false
  freeze: 29
hardware:
  gpu: A10
output:
  root: /mnt/runs
  wandb_project: tiny-person-research
name: gausssplit_smoke
model:
  config: configs/model/yolo26n_tiny_A2_p2_gauss_split.yaml
  pretrained: /mnt/runs/baseline_tinyperson_wacv_150e/20261109-182052-a20f7b6-seed42/training/weights/best.pt
