# Factorial localization experiment: MSR feature module x TAL beta.
# E0/E1 keep beta=6; E2/E3 use beta=4. All other settings are shared.
seed: 42
comparisons:
  - name: msr_effect_beta6
    control: tal_e0_a2
    treatment: tal_e1_a2_msr
  - name: tal_effect_no_msr
    control: tal_e0_a2
    treatment: tal_e2_a2_tal4
  - name: msr_effect_beta4
    control: tal_e2_a2_tal4
    treatment: tal_e3_a2_msr_tal4
  - name: tal_effect_with_msr
    control: tal_e1_a2_msr
    treatment: tal_e3_a2_msr_tal4
data:
  config: /mnt/data/tinyperson_official_v1/data.yaml
train:
  epochs: 50
  patience: 15
  imgsz: 1280
  batch: 8
  optimizer: AdamW
  lr0: 0.001
  amp: true
  deterministic: true
  degrees: 0.0
  translate: 0.05
  scale: 0.15
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.005
  hsv_s: 0.1
  hsv_v: 0.15
  bgr: 0.0
  mosaic: 0.0
  close_mosaic: 10
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  copy_paste_mode: flip
  multi_scale: 0.0
  compile: false
hardware:
  gpu: A10
output:
  root: /mnt/runs
  wandb_project: tiny-person-research
diagnostics:
  enabled: true
  collect_interval_steps: 100
  terminal_interval_steps: 100
  file_interval_steps: 100
  wandb_interval_epochs: 1
  gradient_interval_steps: 100
  epoch_summary: true
  file_logging: true
  gate_metrics: true
  feature_metrics: true
  residual_metrics: true
  gradient_metrics: true
  numerical_health: true
  performance_metrics: false
  cuda_timing: false
  sampled_elements: 4096
  flush_records: 10
models:
  - name: tal_e0_a2
    config: configs/model/yolo26n_tiny_A2_p2.yaml
    pretrained: null
  - name: tal_e1_a2_msr
    config: configs/model/yolo26n_tiny_A2_p2_msr.yaml
    pretrained: null
  - name: tal_e2_a2_tal4
    config: configs/model/yolo26n_tiny_A2_p2_tal4.yaml
    pretrained: null
  - name: tal_e3_a2_msr_tal4
    config: configs/model/yolo26n_tiny_A2_p2_msr_tal4.yaml
    pretrained: null
