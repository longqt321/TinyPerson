# Single-variable MSR evidence-robustness ablation on the fixed A2 P2 graph.
# Control keeps z_max=10 and sigma_min=1e-3; each treatment changes one value.
# Replace seed with seeds: [42, 43, 44] only if a treatment clears the AP75 gate.
seed: 42
comparisons:
  - name: z3_vs_adaptive
    control: msr_evidence_adaptive
    treatment: msr_evidence_z3
  - name: sigma01_vs_adaptive
    control: msr_evidence_adaptive
    treatment: msr_evidence_sigma01
data:
  config: /mnt/data/tinyperson_official_v1/data.yaml
train:
  epochs: 50
  patience: 15
  imgsz: 1280
  batch: 8
  optimizer: AdamW
  lr0: 0.001
  amp: true
  deterministic: true
  degrees: 0.0
  translate: 0.05
  scale: 0.15
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.005
  hsv_s: 0.1
  hsv_v: 0.15
  bgr: 0.0
  mosaic: 0.0
  close_mosaic: 10
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  copy_paste_mode: flip
  multi_scale: 0.0
  compile: false
hardware:
  gpu: A10
output:
  root: /mnt/runs
  wandb_project: tiny-person-research
diagnostics:
  enabled: true
  collect_interval_steps: 100
  terminal_interval_steps: 100
  file_interval_steps: 100
  wandb_interval_epochs: 1
  gradient_interval_steps: 100
  epoch_summary: true
  file_logging: true
  gate_metrics: true
  feature_metrics: true
  residual_metrics: true
  gradient_metrics: true
  numerical_health: true
  performance_metrics: false
  cuda_timing: false
  sampled_elements: 4096
  flush_records: 10
models:
  - name: msr_evidence_adaptive
    config: configs/model/yolo26n_tiny_A2_p2_msr.yaml
  - name: msr_evidence_z3
    config: configs/model/yolo26n_tiny_A2_p2_msr_z3.yaml
  - name: msr_evidence_sigma01
    config: configs/model/yolo26n_tiny_A2_p2_msr_sigma01.yaml
