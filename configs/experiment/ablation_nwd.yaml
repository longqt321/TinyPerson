# 2x2 training-module ablation. All four use the same architecture, data and train settings.
# NWD constant is in input-image pixels; 12.8 is the paper starting point, not tuned for TinyPerson.
seed: 42
data:
  config: /mnt/data/tinyperson/data.yaml
train:
  epochs: 100
  patience: 15
  imgsz: 1280
  batch: 16
  optimizer: AdamW
  lr0: 0.001
  amp: true
  deterministic: true
  degrees: 10.0
  translate: 0.1
  scale: 0.1
  shear: 0.1
  perspective: 0.00001
  flipud: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  bgr: 0.0
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.1
  copy_paste_mode: flip
  multi_scale: 0.0
  compile: false
hardware:
  gpu: L4
output:
  root: /mnt/runs
  wandb_project: tiny-person-research
models:
  - name: baseline
    config: configs/model/yolo26n-p3-only.yaml
  - name: nwd_loss
    config: configs/model/yolo26n-p3-only.yaml
    modules:
      nwd: &nwd_loss
        enabled: true
        constant: 12.8
        weight: 1.0
  - name: nwd_tal
    config: configs/model/yolo26n-p3-only.yaml
    modules:
      nwd_tal: &nwd_tal
        enabled: true
        constant: 12.8
  - name: nwd_full
    config: configs/model/yolo26n-p3-only.yaml
    modules:
      nwd: *nwd_loss
      nwd_tal: *nwd_tal
