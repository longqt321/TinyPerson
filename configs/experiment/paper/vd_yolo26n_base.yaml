# Clean NMS-free YOLO26n-P2 baseline on VisDrone2019-DET (100e, symmetric COCO backbone init)
seed: 42
data:
  config: configs/data/visdrone.yaml
train:
  epochs: 100
  patience: 25
  val: true
  imgsz: 1280
  batch: 16
  workers: 8
  optimizer: AdamW
  lr0: 0.002
  lrf: 0.1
  cos_lr: true
  warmup_epochs: 3.0
  amp: true
  deterministic: false
  degrees: 0.0
  translate: 0.05
  scale: 0.20
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.01
  hsv_s: 0.2
  hsv_v: 0.2
  bgr: 0.0
  mosaic: 0.5
  close_mosaic: 15
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  copy_paste_mode: flip
  augmentations_preset: tinyperson_safe
  multi_scale: 0.0
  compile: false
hardware:
  gpu: A100
output:
  root: runs
  wandb_project: tiny-person-research
name: vd_yolo26n_base
model:
  config: configs/model/yolo26n_p2_base.yaml
  pretrained: yolo26n.pt
