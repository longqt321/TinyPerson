# Ablation 2: YOLO26n-P2 + LGT-Detect w/o Dense Gaussian Field Distillation
seed: 42
data:
  config: configs/data/tinyperson.yaml
train:
  epochs: 150
  patience: 40
  val: true
  imgsz: 1280
  batch: 32
  workers: 8
  optimizer: AdamW
  lr0: 0.002
  lrf: 0.1
  cos_lr: true
  warmup_epochs: 3.0
  amp: true
  deterministic: false
  degrees: 0.0
  translate: 0.05
  scale: 0.15
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.005
  hsv_s: 0.1
  hsv_v: 0.15
  bgr: 0.0
  mosaic: 0.0
  close_mosaic: 10
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  copy_paste_mode: flip
  augmentations_preset: tinyperson_safe
  multi_scale: 0.0
  compile: false
hardware:
  gpu: A100
output:
  root: runs
  wandb_project: tiny-person-research
name: tp_abl_nodistill
model:
  config: configs/model/yolo26n_p2_abl_nodistill.yaml
