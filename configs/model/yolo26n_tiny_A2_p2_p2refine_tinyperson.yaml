# YOLO26n-P2 P2Refine model for TinyPerson (official protocol: single 'person' class)
# Diff vs yolo26n_tiny_A2_p2_dcaf_tinyperson.yaml:
#   - layers 17/18/19 removed (dead chain: their output fed nothing)
#   - DCAF (P2 producer) replaced by P2Refine taking [C2, P3]
#   - indices shifted by -3 from old layer 20 onwards
nc: 1
end2end: True
reg_max: 1
tal_beta: 6.0
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0 - P1/2 (16 ch)
  - [-1, 1, Conv, [128, 3, 2]]      # 1 - P2/4 (32 ch)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 - C2 (64 ch)
  - [-1, 1, Conv, [256, 3, 2]]      # 3 - P3/8 (64 ch)
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 - C3 (128 ch)
  - [-1, 1, Conv, [512, 3, 2]]      # 5 - P4/16 (128 ch)
  - [-1, 2, C3k2, [512, True]]      # 6 - C4 (128 ch)
  - [-1, 1, Conv, [1024, 3, 2]]     # 7 - P5/32 (256 ch)
  - [-1, 2, C3k2, [1024, True]]     # 8 - C5 (256 ch)
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9 - SPPF (256 ch)
  - [-1, 2, C2PSA, [1024]]          # 10 - C2PSA (256 ch)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (from 10)
  - [[-1, 6], 1, Concat, [1]]       # 12 (11 + 6)
  - [-1, 2, C3k2, [512, True]]      # 13 - P4 (128 ch)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (from 13)
  - [[-1, 4], 1, Concat, [1]]       # 15 (14 + 4)
  - [-1, 2, C3k2, [256, True]]      # 16 - P3 (64 ch)
  - [[2, 16], 1, P2Refine, [32]]    # 17 - P2 producer (C2=64, P3=64 -> 32 ch)
  - [-1, 1, Conv, [128, 3, 2]]      # 18 - downsample P2Refine output (32 -> 32 ch)
  - [[-1, 16], 1, Concat, [1]]      # 19 (18 + 16 -> 32+64=96 ch)
  - [-1, 2, C3k2, [256, True]]      # 20 (64 ch)
  - [-1, 1, Conv, [256, 3, 2]]      # 21 (64 -> 64 ch)
  - [[-1, 13], 1, Concat, [1]]      # 22 (21 + 13 -> 64+128=192 ch)
  - [-1, 2, C3k2, [512, True]]      # 23 (128 ch)
  - [-1, 1, Conv, [512, 3, 2]]      # 24 (128 -> 128 ch)
  - [[-1, 10], 1, Concat, [1]]      # 25 (24 + 10 -> 128+256=384 ch)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 26 (256 ch)
  - [[17, 20, 23, 26], 1, Detect, [nc]]    # 27 - Detect head over [P2Refine, P3, P4, P5]
