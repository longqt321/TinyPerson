# YOLO26n-P2 with six explicit neck-fusion slots for the full MSR system.
# Set scale:n explicitly; the fusion channel splits are validated for YOLO26-nano.
nc: 1
end2end: True
reg_max: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2 backbone
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3 backbone
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4 backbone
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10-P5 backbone

head:
  # Top-down FPN: each MSR slot follows Concat([upsampled high, lateral low]).
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12: P5 up + P4 lateral
  - [-1, 1, nn.Identity, []] # 13: MSR fusion P5 -> P4
  - [-1, 2, C3k2, [512, True]] # 14-P4 top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]] # 16: P4 up + P3 lateral
  - [-1, 1, nn.Identity, []] # 17: MSR fusion P4 -> P3
  - [-1, 2, C3k2, [256, True]] # 18-P3 top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [[-1, 2], 1, Concat, [1]] # 20: P3 up + P2 lateral
  - [-1, 1, nn.Identity, []] # 21: MSR fusion P3 -> P2
  - [-1, 2, C3k2, [128, True]] # 22-P2 detection feature

  # Bottom-up PAN: gates fuse downsampled fine features with coarser semantics.
  - [-1, 1, Conv, [128, 3, 2]] # 23-P2 -> P3
  - [[-1, 18], 1, Concat, [1]] # 24: downsampled P2 + P3 top-down
  - [-1, 1, nn.Identity, []] # 25: MSR fusion P2 -> P3
  - [-1, 2, C3k2, [256, True]] # 26-P3 detection feature
  - [-1, 1, Conv, [256, 3, 2]] # 27-P3 -> P4
  - [[-1, 14], 1, Concat, [1]] # 28: downsampled P3 + P4 top-down
  - [-1, 1, nn.Identity, []] # 29: MSR fusion P3 -> P4
  - [-1, 2, C3k2, [512, True]] # 30-P4 detection feature
  - [-1, 1, Conv, [512, 3, 2]] # 31-P4 -> P5
  - [[-1, 10], 1, Concat, [1]] # 32: downsampled P4 + P5 backbone
  - [-1, 1, nn.Identity, []] # 33: MSR fusion P4 -> P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 34-P5 detection feature
  - [[22, 26, 30, 34], 1, Detect, [nc]] # 35-Detect(P2, P3, P4, P5)
