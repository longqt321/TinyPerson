# Ultralytics YOLO26-nano with a P2 Identity slot for local residual modulation.
# MSR modifies only the P2 detection branch; P3 consumes the ungated feature.
nc: 1
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 12: backbone P4
  - [-1, 2, C3k2, [512, True]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 15: backbone P3
  - [-1, 2, C3k2, [256, True]] # 16: P3/8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # 18: backbone P2
  - [-1, 2, C3k2, [128, True]] # 19: P2/4 feature
  - [-1, 1, nn.Identity, []] # 20: replace with MSR for A1-A3
  - [19, 1, Conv, [128, 3, 2]] # 21: P2->P3; bypasses the MSR gate
  - [[-1, 16], 1, Concat, [1]] # 22: head P3
  - [-1, 2, C3k2, [256, True]] # 23: P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 13], 1, Concat, [1]] # 25: head P4
  - [-1, 2, C3k2, [512, True]] # 26: P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 27
  - [[-1, 10], 1, Concat, [1]] # 28: head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 29: P5/32
  - [[20, 23, 26, 29], 1, Detect, [nc]] # 30: Detect(P2, P3, P4, P5)
