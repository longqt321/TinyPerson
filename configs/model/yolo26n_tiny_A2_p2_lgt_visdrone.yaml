# YOLO26n-P2 + LGT-Detect for 10-class VisDrone generalization benchmark
nc: 10
end2end: True
reg_max: 1
tal_beta: 4.0
tal_tiny_floor: 0.0
tal_wasserstein: 0.50
loss_wasserstein: 0.35
wasserstein_ref_px: 32.0
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0 - P1/2 (16 ch)
  - [-1, 1, Conv, [128, 3, 2]]      # 1 - P2/4 (32 ch)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 - C2 (64 ch)
  - [-1, 1, Conv, [256, 3, 2]]      # 3 - P3/8 (64 ch)
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 - C3 (128 ch)
  - [-1, 1, Conv, [512, 3, 2]]      # 5 - P4/16 (128 ch)
  - [-1, 2, C3k2, [512, True]]      # 6 - C4 (128 ch)
  - [-1, 1, Conv, [1024, 3, 2]]     # 7 - P5/32 (256 ch)
  - [-1, 2, C3k2, [1024, True]]     # 8 - C5 (256 ch)
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9 - SPPF (256 ch)
  - [-1, 2, C2PSA, [1024]]          # 10 - C2PSA (256 ch)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]]       # 12
  - [-1, 2, C3k2, [512, True]]      # 13 - P4 (128 ch)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]       # 15
  - [-1, 2, C3k2, [256, True]]      # 16 - P3 (64 ch)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]]       # 18
  - [-1, 2, C3k2, [128, True]]      # 19 - P2 (32 ch)
  - [-1, 1, Conv, [128, 3, 2]]      # 20
  - [[-1, 16], 1, Concat, [1]]      # 21
  - [-1, 2, C3k2, [256, True]]      # 22 - P3 neck (64 ch)
  - [-1, 1, Conv, [256, 3, 2]]      # 23
  - [[-1, 13], 1, Concat, [1]]      # 24
  - [-1, 2, C3k2, [512, True]]      # 25 - P4 neck (128 ch)
  - [-1, 1, Conv, [512, 3, 2]]      # 26
  - [[-1, 10], 1, Concat, [1]]      # 27
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28 - P5 neck (256 ch)
  - [[19, 22, 25, 28], 1, LGTDetect, [nc, 16, 1.5, 0.15, 0.5, True]] # 29 - LGTDetect head
