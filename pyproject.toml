[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-person-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ultralytics>=8.4,<9", "numpy>=1.26,<3", "pandas>=2.2,<3", "PyYAML>=6,<7", "Pillow>=10,<13", "opencv-python-headless>=4.10,<5", "matplotlib>=3.9,<4", "modal>=1,<2"]

[project.optional-dependencies]
cpu = ["torch>=2.7,<3", "torchvision>=0.22,<1"]
gpu = ["torch>=2.7,<3", "torchvision>=0.22,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "jupyterlab>=4,<5"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "gpu"}]]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", extra = "cpu"}, {index = "pytorch-cu128", extra = "gpu"}]
torchvision = [{index = "pytorch-cpu", extra = "cpu"}, {index = "pytorch-cu128", extra = "gpu"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/tinydet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
