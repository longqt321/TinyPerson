[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-person-research"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ultralytics>=8.4.208,<9",
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
    "PyYAML>=6,<7",
    "Pillow>=13,<14",
    "opencv-python-headless>=4.10,<5",
    "matplotlib>=3.11,<4",
    "modal>=1.6,<2",
    "scikit-learn>=1.9,<2",
    "seaborn>=0.13.2",
    "wandb>=0.31,<1",
    "polars>=2.1,<3",
]

[project.optional-dependencies]
cpu = ["torch>=2.7,<3", "torchvision>=0.22,<1"]
gpu = ["torch>=2.7,<3", "torchvision>=0.22,<1"]

[dependency-groups]
dev = ["ruff>=0.17,<1", "mypy>=2.4,<3", "jupyterlab>=4,<5"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "gpu"}]]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", extra = "cpu"}, {index = "pytorch-cu128", extra = "gpu"}]
torchvision = [{index = "pytorch-cpu", extra = "cpu"}, {index = "pytorch-cu128", extra = "gpu"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/tinydet"]

[tool.ruff]
line-length = 100
target-version = "py314"

