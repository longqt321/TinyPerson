name: CPU checks

on:
  pull_request:
    paths:
      - "src/tinydet/**"
      - "scripts/**"
      - "modal/**"
      - "docs/TINYPERSON_BENCHMARK.md"
      - ".github/workflows/cpu-checks.yml"
  push:
    branches: [main]
    paths:
      - "src/tinydet/**"
      - "scripts/**"

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install CPU environment
        run: uv sync --extra cpu --group dev
      - name: Lint
        run: uv run --extra cpu ruff check src/tinydet scripts modal
