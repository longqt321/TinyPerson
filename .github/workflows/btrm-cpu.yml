name: BTRM CPU preflight

on:
  pull_request:
  workflow_dispatch:

jobs:
  btrm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install pinned CPU dependencies
        run: uv sync --extra cpu --group dev
      - name: Static Python module checks
        run: |
          uv run --extra cpu python -m compileall -q src/tinydet modal scripts/btrm_smoke.py tests/test_btrm.py
          uv run --extra cpu ruff check src/tinydet/modules/btrm.py src/tinydet/evaluation/btrm_report.py scripts/btrm_smoke.py tests/test_btrm.py
      - name: CPU YOLO architecture/checkpoint preflight
        run: uv run --extra cpu python scripts/btrm_smoke.py
      - name: BTRM unit tests
        run: uv run --extra cpu pytest -q tests/test_btrm.py
